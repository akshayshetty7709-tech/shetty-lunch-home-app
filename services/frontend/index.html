<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shetty Lunch Home - Food Delivery</title>
<style>
  :root { --maroon:#7a1f1f; --saffron:#e8870e; --cream:#fff8ec; --ink:#2b2118; --muted:#7b6f63; --line:#eadfce; --ok:#2e7d32; --bad:#c62828; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--cream); color:var(--ink); }
  header { background:var(--maroon); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:1.35rem; letter-spacing:.3px; }
  header h1 span { color:var(--saffron); }
  header small { opacity:.8; display:block; font-weight:400; font-size:.75rem; }
  nav { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:8px 14px; background:var(--saffron); color:#fff; font-weight:600; }
  button.ghost { background:transparent; border:1px solid rgba(255,255,255,.5); }
  button.alt { background:#fff; color:var(--maroon); border:1px solid var(--maroon); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  main { max-width:1100px; margin:0 auto; padding:20px; display:grid; grid-template-columns: 1fr 320px; gap:20px; }
  @media (max-width:860px){ main{ grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .rest h3 { margin:0 0 4px; }
  .muted { color:var(--muted); font-size:.85rem; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:.75rem; background:#f5e8d3; margin-right:4px; }
  .veg { color:var(--ok); } .nonveg { color:var(--bad); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  h2 { margin:0 0 12px; }
  input, select, textarea { font:inherit; width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; margin:4px 0 10px; background:#fff; }
  dialog { border:0; border-radius:14px; padding:22px; width:min(380px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .status { font-weight:700; } .CONFIRMED,.DELIVERED{ color:var(--ok);} .PAYMENT_FAILED,.CANCELLED{ color:var(--bad);} .PLACED{ color:var(--saffron);}
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; display:none; z-index:10; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:20px; }
  .link { color:var(--maroon); cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>🍛 Shetty <span>Lunch</span> Home<small>Authentic coastal flavours, delivered to your door</small></h1>
  <nav>
    <button class="ghost" id="navRest">Restaurants</button>
    <button class="ghost" id="navOrders">My Orders</button>
    <span id="who"></span>
    <button id="btnAuth">Login / Sign up</button>
  </nav>
</header>

<main>
  <section id="content"></section>
  <aside class="card" id="cartBox">
    <h2>Your Cart</h2>
    <div id="cart"></div>
  </aside>
</main>
<footer>Shetty Lunch Home · DevOps practice project · <span id="ver"></span></footer>
<div id="toast"></div>

<dialog id="authDlg">
  <div class="tabs">
    <button class="alt" id="tabLogin">Login</button>
    <button class="alt" id="tabReg">Sign up</button>
  </div>
  <form id="authForm" method="dialog">
    <div id="regFields">
      <label>Name<input id="fName" autocomplete="name"></label>
      <label>Phone<input id="fPhone" autocomplete="tel"></label>
      <label>Address<textarea id="fAddr" rows="2"></textarea></label>
    </div>
    <label>Email<input id="fEmail" type="email" autocomplete="email" required></label>
    <label>Password (min 6)<input id="fPass" type="password" autocomplete="current-password" required></label>
    <div style="display:flex; gap:8px; justify-content:flex-end">
      <button type="button" class="alt" id="authCancel">Cancel</button>
      <button type="submit" id="authSubmit">Continue</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = (n) => '₹' + Number(n).toFixed(2);

let session = JSON.parse(localStorage.getItem('slh_session') || 'null');
let cart = { restaurantId: null, restaurantName: '', items: {} }; // items: { id: {name, price, qty} }
let authMode = 'login';

async function api(path, { method = 'GET', body } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (session) headers.Authorization = 'Bearer ' + session.token;
  const res = await fetch('/api' + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 3200);
}

// ---------- auth ----------
function renderAuthState() {
  $('#who').textContent = session ? 'Hi, ' + session.user.name.split(' ')[0] : '';
  $('#btnAuth').textContent = session ? 'Logout' : 'Login / Sign up';
}
function setAuthMode(mode) {
  authMode = mode;
  $('#regFields').style.display = mode === 'register' ? 'block' : 'none';
  $('#tabLogin').style.background = mode === 'login' ? '#f5e8d3' : '#fff';
  $('#tabReg').style.background = mode === 'register' ? '#f5e8d3' : '#fff';
}
$('#btnAuth').onclick = () => {
  if (session) { session = null; localStorage.removeItem('slh_session'); renderAuthState(); toast('Logged out'); showRestaurants(); return; }
  setAuthMode('login'); $('#authDlg').showModal();
};
$('#tabLogin').onclick = () => setAuthMode('login');
$('#tabReg').onclick = () => setAuthMode('register');
$('#authCancel').onclick = () => $('#authDlg').close();
$('#authForm').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const email = $('#fEmail').value.trim(), password = $('#fPass').value;
    if (authMode === 'register') {
      await api('/users/register', { method: 'POST', body: { name: $('#fName').value, phone: $('#fPhone').value, address: $('#fAddr').value, email, password } });
      toast('Account created - logging you in');
    }
    session = await api('/users/login', { method: 'POST', body: { email, password } });
    localStorage.setItem('slh_session', JSON.stringify(session));
    $('#authDlg').close(); renderAuthState(); toast('Welcome, ' + session.user.name);
  } catch (err) { toast(err.message); }
};

// ---------- restaurants + menu ----------
async function showRestaurants() {
  $('#content').innerHTML = '<div class="card">Loading restaurants…</div>';
  try {
    const list = await api('/restaurants');
    $('#content').innerHTML = '<h2>Restaurants near you</h2><div class="grid">' + list.map((r) => `
      <div class="card rest">
        <h3>${esc(r.name)}</h3>
        <div class="muted">${esc(r.cuisine)} · ⭐ ${esc(r.rating)}</div>
        <div class="muted">${esc(r.address)}</div>
        <p><button data-open="${r.id}" data-name="${esc(r.name)}">View menu</button></p>
      </div>`).join('') + '</div>';
  } catch (err) { $('#content').innerHTML = '<div class="card">Could not load restaurants: ' + esc(err.message) + '</div>'; }
}

async function showMenu(id, name) {
  const menu = await api('/restaurants/' + id + '/menu');
  $('#content').innerHTML = `<p><span class="link" id="back">← All restaurants</span></p><h2>${esc(name)}</h2><div class="card">` +
    menu.map((m) => `
      <div class="row">
        <div><strong>${esc(m.name)}</strong> <span class="${m.is_veg ? 'veg' : 'nonveg'}">●</span>
          <div class="muted">${esc(m.description)}</div></div>
        <div style="text-align:right"><div>${money(m.price)}</div>
          <button data-add="${m.id}" data-n="${esc(m.name)}" data-p="${m.price}" data-r="${id}" data-rn="${esc(name)}">Add</button></div>
      </div>`).join('') + '</div>';
  $('#back').onclick = showRestaurants;
}

// ---------- cart ----------
function renderCart() {
  const ids = Object.keys(cart.items);
  if (!ids.length) { $('#cart').innerHTML = '<div class="muted">Your cart is empty.</div>'; return; }
  let total = 0;
  const rows = ids.map((id) => {
    const it = cart.items[id]; total += it.price * it.qty;
    return `<div class="row"><div>${esc(it.name)}<div class="muted">${money(it.price)} × ${it.qty}</div></div>
      <div><button class="alt" data-dec="${id}">−</button> <button class="alt" data-inc="${id}">+</button></div></div>`;
  }).join('');
  $('#cart').innerHTML = `<div class="muted">${esc(cart.restaurantName)}</div>${rows}
    <p><strong>Total: ${money(total)}</strong></p>
    <label>Payment<select id="payMethod"><option value="COD">Cash on delivery</option><option value="UPI">UPI</option><option value="CARD">Card</option></select></label>
    <label>Delivery address<textarea id="addr" rows="2">${esc(session?.user?.address || '')}</textarea></label>
    <button id="placeOrder" style="width:100%">Place order</button>`;
  $('#placeOrder').onclick = placeOrder;
}

async function placeOrder() {
  if (!session) { setAuthMode('login'); $('#authDlg').showModal(); return; }
  try {
    const items = Object.entries(cart.items).map(([menuItemId, it]) => ({ menuItemId: Number(menuItemId), quantity: it.qty }));
    const order = await api('/orders', { method: 'POST', body: { restaurantId: cart.restaurantId, items, paymentMethod: $('#payMethod').value, deliveryAddress: $('#addr').value } });
    cart = { restaurantId: null, restaurantName: '', items: {} }; renderCart();
    toast(`Order #${order.id}: ${order.status}`); showOrders();
  } catch (err) { toast(err.message); }
}

// ---------- orders ----------
async function showOrders() {
  if (!session) { setAuthMode('login'); $('#authDlg').showModal(); return; }
  try {
    const orders = await api('/orders');
    $('#content').innerHTML = '<h2>My orders</h2><div class="card">' + (orders.length ? orders.map((o) => `
      <div class="row"><div><strong>Order #${o.id}</strong>
        <div class="muted">${new Date(o.created_at).toLocaleString()} · ${esc(o.payment_method)}</div></div>
        <div style="text-align:right">${money(o.total_amount)}<div class="status ${esc(o.status)}">${esc(o.status)}</div>
        ${['PLACED','CONFIRMED','PAYMENT_FAILED'].includes(o.status) ? `<span class="link" data-cancel="${o.id}">Cancel</span>` : ''}</div></div>`).join('') : '<div class="muted">No orders yet.</div>') + '</div>';
  } catch (err) { toast(err.message); }
}

// ---------- events ----------
document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.dataset.open) return showMenu(t.dataset.open, t.dataset.name);
  if (t.dataset.add) {
    if (cart.restaurantId && String(cart.restaurantId) !== t.dataset.r) { cart = { restaurantId: null, restaurantName: '', items: {} }; toast('Cart cleared - one restaurant per order'); }
    cart.restaurantId = Number(t.dataset.r); cart.restaurantName = t.dataset.rn;
    const it = cart.items[t.dataset.add] || { name: t.dataset.n, price: Number(t.dataset.p), qty: 0 };
    it.qty += 1; cart.items[t.dataset.add] = it; return renderCart();
  }
  if (t.dataset.inc) { cart.items[t.dataset.inc].qty += 1; return renderCart(); }
  if (t.dataset.dec) { const it = cart.items[t.dataset.dec]; it.qty -= 1; if (it.qty <= 0) delete cart.items[t.dataset.dec]; return renderCart(); }
  if (t.dataset.cancel) { try { await api('/orders/' + t.dataset.cancel + '/cancel', { method: 'POST' }); toast('Order cancelled'); showOrders(); } catch (err) { toast(err.message); } }
});
$('#navRest').onclick = showRestaurants;
$('#navOrders').onclick = showOrders;

renderAuthState(); renderCart(); showRestaurants();
</script>
</body>
</html>
