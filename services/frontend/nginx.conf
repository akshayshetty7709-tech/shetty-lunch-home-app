# Frontend nginx: serves the static UI and acts as the single public entry point (API gateway)
# for the three PUBLIC APIs. Service names resolve through Docker Compose DNS locally and
# through Kubernetes Service DNS (same namespace) in the cluster - so this file is identical everywhere.
#
# NOT exposed on purpose: /api/menu-items (internal, used by order-service) and /api/payments
# (internal, used by order-service).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location /api/users {
        proxy_pass http://user-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/restaurants {
        proxy_pass http://restaurant-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/orders {
        proxy_pass http://order-service:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
